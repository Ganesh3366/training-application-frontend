<section aria-labelledby="confirm-dialog-title">
  <h2 mat-dialog-title id="confirm-dialog-title">{{ data.title }}</h2>
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close(false)" cdkFocusInitial>
      {{ data.cancelText }}
    </button>
    <button mat-flat-button type="button" color="primary" (click)="close(true)">
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</section>
