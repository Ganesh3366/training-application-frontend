<section class="confirm-dialog" aria-labelledby="confirm-dialog-title">
  <h2 class="confirm-dialog__title" mat-dialog-title id="confirm-dialog-title">
    {{ data.title }}
  </h2>
  <mat-dialog-content class="confirm-dialog__content">
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions class="confirm-dialog__actions" align="end">
    <button mat-button type="button" (click)="close(false)" cdkFocusInitial>
      {{ data.cancelText }}
    </button>
    <button mat-flat-button type="button" color="primary" (click)="close(true)">
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</section>
