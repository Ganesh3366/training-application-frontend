<div class="app-shell">
  <header class="site-header">
    <div class="header-inner">
      <a routerLink="/" class="brand" (click)="closeMobileMenu()" aria-label="SkillForge home">
        <span class="brand-mark"><mat-icon>school</mat-icon></span>
        <span class="brand-copy"><strong>SkillForge</strong><small>Learn Skills. Build Confidence.</small></span>
      </a>
      <nav class="desktop-nav" aria-label="Main navigation">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        <a routerLink="/courses" routerLinkActive="active">Courses</a>
        <a routerLink="/how-it-works" routerLinkActive="active">How It Works</a>
        <a routerLink="/certification" routerLinkActive="active">Certification</a>
      </nav>
      <div class="auth-actions">
        @if (!isLoggedIn()) {
          <button mat-stroked-button class="login-button" (click)="openLoginDialog()">Log In</button>
          <button mat-flat-button class="signup-button" (click)="openSignupDialog()">Sign Up</button>
        } @else {
          <span class="role-badge">{{ currentRole() }}</span>
          <button mat-stroked-button [matMenuTriggerFor]="accountMenu" class="account-button">
            <mat-icon>account_circle</mat-icon>{{ currentUser()?.name }}
          </button>
          <mat-menu #accountMenu="matMenu">
            <button mat-menu-item (click)="logout()" [disabled]="logoutPending()">
              <mat-icon>logout</mat-icon>{{ logoutPending() ? 'Signing out...' : 'Sign out' }}
            </button>
          </mat-menu>
        }
      </div>
      <button mat-icon-button class="menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu">
        <mat-icon>{{ isMobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
    @if (isMobileMenuOpen()) {
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a routerLink="/" (click)="closeMobileMenu()">Home</a>
        <a routerLink="/courses" (click)="closeMobileMenu()">Courses</a>
        <a routerLink="/how-it-works" (click)="closeMobileMenu()">How It Works</a>
        <a routerLink="/certification" (click)="closeMobileMenu()">Certification</a>
        @if (!isLoggedIn()) {
          <button mat-stroked-button (click)="openLoginDialog()">Log In</button>
          <button mat-flat-button class="signup-button" (click)="openSignupDialog()">Sign Up</button>
        } @else {
          <span>{{ currentUser()?.name }}</span>
          <button mat-stroked-button (click)="logout()" [disabled]="logoutPending()">
            {{ logoutPending() ? 'Signing out...' : 'Sign out' }}
          </button>
        }
      </nav>
    }
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
