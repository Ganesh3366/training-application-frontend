<section class="form-dialog" aria-labelledby="module-form-title">
  <header>
    <div>
      <p>Module Management</p>
      <h2 id="module-form-title">{{ isEditMode ? 'Edit module' : 'Add module' }}</h2>
    </div>
    <button
      mat-icon-button
      type="button"
      aria-label="Close module form"
      [disabled]="submitting()"
      (click)="close()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <mat-dialog-content>
    <form id="module-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Module title</mat-label>
        <input matInput formControlName="title" autocomplete="off" cdkFocusInitial />
        @if (form.controls.title.touched && form.controls.title.invalid) {
          <mat-error>Enter a module title.</mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="4"></textarea>
        <mat-hint>Optional</mat-hint>
      </mat-form-field>
      @if (submissionError()) {
        <p class="error" role="alert">
          <mat-icon aria-hidden="true">error_outline</mat-icon>{{ submissionError() }}
        </p>
      }
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [disabled]="submitting()" (click)="close()">Cancel</button>
    <button
      mat-flat-button
      class="primary"
      type="submit"
      form="module-form"
      [disabled]="submitting()"
    >
      {{ submitting() ? 'Saving...' : isEditMode ? 'Save changes' : 'Add module' }}
    </button>
  </mat-dialog-actions>
</section>
